server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        # $http_host, not $host: $host drops the port, so a redirect the API
        # builds from it (e.g. /api/docs -> /api/docs/) would send the
        # browser to a port nothing is listening on.
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
